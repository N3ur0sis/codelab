version: '3.8'

services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
     # - /app/node_modules # Avoid syncing node_modules to host

  backend:
    container_name: backend
    image: backend
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    environment:
      - CHOKIDAR_USEPOLLING=true # Enable polling
    env_file:
      - .env.development
    volumes:
      - ./backend:/usr/src/app
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma generate && nodemon --config nodemon.json"]

  db:
    container_name: db
    image: postgres:12
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    container_name: redis
    image: redis:7
    restart: always
    ports:
      - "6379:6379" # Expose Redis port
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"] # Optional configuration

  worker:
    container_name: worker
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    depends_on:
      - redis
      - db
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_URL=postgresql://postgres:postgres@db:5432/postgres?schema=public
      - KUBECONFIG=/root/.kube/config # ✅ Set Kubeconfig Path
    env_file:
      - .env.development
    volumes:
      - ~/.kube:/root/.kube # ✅ Mount Kubernetes config inside worker
    command: ["node", "src/workers/testWorker.js"]

volumes:
  pgdata: {}