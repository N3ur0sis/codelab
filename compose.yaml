services:
  frontend:
    container_name: frontend
    image: frontend
    build:
      context: ./frontend
      dockerfile: frontend.dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules # Avoid syncing node_modules to host


  backend:
    container_name: backend
    image: backend
    build:
      context: ./backend
      dockerfile: backend.dockerfile
    ports:
      - "4000:4000"
    depends_on:
      - db
    env_file:
      - .env.development
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules # Avoid syncing node_modules to host
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma generate && npm run seed && npm run dev"]

  db:
    container_name: db
    image: postgres:12
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.development
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
